<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product details | Aotearoa Adventure Gear</title>
  <meta name="description" content="Product specifications, reviews and similar gear from Aotearoa Adventure Gear.">

  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">

  <!-- Vendor stylesheets, held locally so the site runs with no web server. -->
  <link rel="stylesheet" href="css/third_party/bootstrap.min.css">
  <link rel="stylesheet" href="css/third_party/bootstrap-icons.css">

  <!-- Custom stylesheets, after the framework so they win on equal specificity. -->
  <link rel="stylesheet" href="css/custom-theme.css">
  <link rel="stylesheet" href="css/custom-layout.css">
  <link rel="stylesheet" href="css/custom-nav.css">
  <link rel="stylesheet" href="css/custom-components.css">
  <link rel="stylesheet" href="css/custom-catalogue.css">
  <link rel="stylesheet" href="css/custom-forms.css">
</head>

<!-- data-x-data puts the whole page in Alpine's scope, so any element
     below can read $store. See js/services/alpine.js. -->
<body data-x-data>
  <!-- First focusable element, so a keyboard user can skip the navigation. -->
  <a class="gear-skip-link" href="#main-content">Skip to main content</a>

  <header class="gear-masthead">
    <nav class="navbar navbar-expand-lg container-xxl" aria-label="Primary">
      <a class="navbar-brand gear-brand" href="index.html">
        <img src="images/logo-aotearoa-adventure-gear.png" alt="Aotearoa Adventure Gear - home">
      </a>

      <!-- Outside the collapse on purpose: a shopper on a phone must be able to
           see the cart and its count without opening the menu first. -->
      <div class="d-flex align-items-center order-lg-last ms-auto ms-lg-3">
        <a class="btn gear-cart-button" href="cart.html">
          <i class="bi bi-cart-fill" aria-hidden="true"></i>Your Cart
          <!-- Hidden at zero, so an empty badge leaves the accessibility tree
               rather than just the screen. data-x-cloak keeps the placeholder
               out of sight until Alpine fills it in. -->
          <span class="gear-cart-button__badge" data-cart-count data-x-cloak
                data-x-show="$store.cart.totals.count> 0"
                data-x-text="$store.cart.totals.count">0</span>
          <span class="visually-hidden" data-cart-label
                data-x-text="$store.cart.totals.count === 1
                               ? '1 item in cart'
                               : $store.cart.totals.count + ' items in cart'">0 items in cart</span>
        </a>

        <button class="navbar-toggler border-0 ms-2" type="button" data-bs-toggle="collapse"
                data-bs-target="#primary-nav" aria-controls="primary-nav"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>

      <!-- ms-lg-auto right-aligns these. Without it only the home page lines up,
           because its search box is flex-grow-1 and does the pushing. -->
      <div class="collapse navbar-collapse flex-grow-0 ms-lg-auto" id="primary-nav">
        <ul class="navbar-nav gear-nav align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="shop.html" aria-current="page">Shop</a></li>
          <li class="nav-item"><a class="nav-link" href="index.html#newsletter">Help</a></li>
        </ul>
      </div>
    </nav>
  </header>

<main id="main-content">
  <!-- product chosen by ?id=; js/pages/product.js falls back to the first item -->
  <article class="gear-product-detail" aria-labelledby="product-title">
    <div class="row g-0">
      <div class="col-12 col-md-6 gear-product-detail__media">
        <img
          class="gear-product-detail__image"
          src="images/placeholder-product.svg"
          alt=""
          data-product-image>
      </div>

      <div class="col-12 col-md-6 gear-product-detail__body">
        <h1 class="gear-display" id="product-title" data-product-name>Product title</h1>

        <div class="d-flex align-items-center gap-2 mb-3">
          <div class="gear-stars" data-product-stars></div>
          <a class="gear-muted" href="#reviews" data-product-review-count>0 reviews</a>
        </div>

        <hr>

        <form
          class="row g-3 align-items-end"
          data-validate="add-to-cart"
          data-success-message="Added to your cart."
>
          <div class="col-12 col-sm-5">
            <p class="gear-price gear-product-detail__price mb-0" data-product-price>$0.00</p>
          </div>

          <div class="col-12 col-sm-7">
            <label class="visually-hidden" for="product-model">Select model</label>
            <select
              class="form-select"
              id="product-model"
              name="model"
              required
              data-product-models
              aria-describedby="product-model-error"
              data-error-required="Choose a model before adding to the cart."
>
              <option value="">Select Model</option>
            </select>
            <p class="invalid-feedback" id="product-model-error" role="alert"></p>
          </div>

          <div class="col-12">
            <p class="gear-muted" data-product-description></p>
          </div>

          <div class="col-6 col-sm-4">
            <label class="form-label" for="product-qty">Quantity</label>
            <!-- min/step are native; data-rule adds whole-number and stock checks -->
            <input
              type="number"
              class="form-control"
              id="product-qty"
              name="qty"
              value="1"
              min="1"
              step="1"
              required
              data-rule="quantity"
              data-max-stock="1"
              aria-describedby="product-qty-error">
            <p class="invalid-feedback" id="product-qty-error" role="alert"></p>
          </div>

          <div class="col-12">
            <hr class="gear-rule ms-0">
            <button type="submit" class="btn btn-primary" data-add-to-cart>Add To Cart</button>
            <p class="gear-form-status" data-form-status role="status"></p>
          </div>
        </form>
      </div>
    </div>
  </article>

  <section class="gear-section gear-section--tint" aria-labelledby="similar-heading">
    <div class="container-xxl">
      <h2 class="gear-display text-center mb-5" id="similar-heading">Similar Products</h2>
      <div class="row g-4">
        <!-- Horizontal product row, as wireframe 02 shows. Parameters:
               collection  Alpine expression yielding an array of products
               columns     grid classes for the wrapper column -->
        <template data-x-for="product in $store.catalogue.similar">
          <div class="col-12 col-md-4">
            <article class="gear-product-row">
              <a data-x-effect="$el.href = $store.catalogue.productHref(product)">
                <img src="images/placeholder-product.svg" alt="" loading="lazy"
                     onerror="this.onerror=null;this.src='images/placeholder-product.svg'"
                     data-x-effect="$el.src = product.image; $el.alt = product.name">
              </a>
              <div>
                <h3 class="gear-label mb-1">
                  <a class="text-decoration-none" data-x-text="product.name"
                     data-x-effect="$el.href = $store.catalogue.productHref(product)">Product name</a>
                </h3>
                <div class="gear-stars"
                     data-x-effect="Store.ui.renderStars($el, product.rating, product.reviewCount)"></div>
                <p class="gear-price mb-0" data-x-text="$money(product.price)">$0.00</p>
              </div>
            </article>
          </div>
        </template>
      </div>
    </div>
  </section>

  <section class="gear-section" id="reviews" aria-labelledby="reviews-heading">
    <div class="container-xxl">
      <h2 class="gear-display mb-4" id="reviews-heading">Reviews</h2>
      <ul class="list-unstyled">
        <template data-x-for="review in $store.catalogue.reviews">
          <li class="gear-review">
            <div class="gear-review__avatar"><i class="bi bi-person" aria-hidden="true"></i></div>
            <div>
              <p class="gear-review__author" data-x-text="review.author">Reviewer</p>
              <!-- <time> carries the machine-readable date; the text stays human. -->
              <time class="gear-review__date d-block" data-x-text="review.displayDate"
                    data-x-effect="$el.dateTime = review.date">Date</time>
              <div class="gear-stars" data-x-effect="Store.ui.renderStars($el, review.rating)"></div>
            </div>
            <p class="gear-review__body" data-x-text="review.body">Review text</p>
          </li>
        </template>
      </ul>

      <p class="gear-muted" data-x-cloak data-x-show="$store.catalogue.reviews.length === 0">
        No reviews yet for this product.
      </p>
    </div>
  </section>
</main>


  <footer class="gear-footer">
    <div class="container-xxl">
      <nav aria-label="Footer">
        <ul class="gear-footer__nav">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="index.html#newsletter">Help</a></li>
        </ul>
      </nav>
      <p class="gear-footer__base text-center mb-0">
        <i class="bi bi-c-circle" aria-hidden="true"></i>
        <span data-current-year>2025</span>
        Aotearoa Adventure Gear
      </p>
    </div>
  </footer>

  <!-- Classic scripts sharing one global scope; ES modules cannot be fetched
       over file://. Load order matters - see BASE_JS in pages.py. -->
  <script src="js/third_party/bootstrap.bundle.min.js"></script>
  <script src="js/services/config.js"></script>
  <script src="js/services/dom.js"></script>
  <script src="js/services/events.js"></script>
  <script src="js/services/money.js"></script>
  <script src="js/services/storage.js"></script>
  <script src="js/services/products.js"></script>
  <script src="js/services/cart.js"></script>
  <script src="js/services/validation-rules.js"></script>
  <script src="js/services/validation.js"></script>
  <script src="js/services/alpine.js"></script>
  <script src="js/components/stars.js"></script>
  <script src="js/components/site-header.js"></script>
  <script src="js/third_party/alpine.min.js"></script>
  <script src="js/pages/product.js"></script>
</body>
</html>
