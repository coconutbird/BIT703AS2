<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img"
     aria-label="Product photograph coming soon">
  <!-- Square viewBox with the glyph centred, so object-fit: cover crops
       evenly whatever shape the tile is. An earlier version carried the
       wordmark and it was clipped in the portrait category tiles. -->
  <rect width="400" height="400" fill="#f2f4f4"/>
  <g fill="#a5bac8">
    <path d="M60 270 L150 160 L200 220 L240 175 L340 270 Z"/>
    <circle cx="288" cy="150" r="26"/>
  </g>
  <path d="M40 270 H360" stroke="#cbd2d2" stroke-width="2"/>
</svg>
